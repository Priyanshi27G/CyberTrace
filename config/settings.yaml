app:
  name: "CyberTrace"
  version: "1.0.0"

capture:
  default_interface: "eth0"
  max_buffer: 5000
  bpf_filter: ""

detection:
  enabled:
    - dos
    - port_scan
    - dns_anomaly
    - ml_anomaly

geoip:
  provider: "ip_api"
  base_url: "http://ip-api.com/json"
  rate_limit: 45
  cache_ttl: 3600

storage:
  db_path: "data/cybertrace.db"
  max_packets: 50000

dashboard:
  refresh_interval: 2
  max_display_packets: 30
  theme: "dark"
